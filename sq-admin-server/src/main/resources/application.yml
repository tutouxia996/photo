# 项目相关配置
sq:
  # 名称
  name: SQ-Admin-Server
  # 版本
  version: 1.0.0
  # 版权年份
  copyrightYear: 2025
  # 实例演示开关
  demoEnabled: true
  # 文件路径 示例（ Windows配置D:/uploadPath，Linux配置 /home/uploadPath）
  profile: D:/uploadPath
  # 获取ip地址开关
  addressEnabled: true
  # 验证码类型 math 数组计算 char 字符验证
  captchaType: math

  crypto:
    sm2:
      # 外部 keystore 路径（生产环境配置）；为空时使用 classpath
      external: ${SQ_KEYSTORE_PATH:}
      # classpath 路径（开发态默认）
      classpath: keystore/sq-sm2.p12
      # keystore 密码（生产必须通过环境变量 SQ_KEYSTORE_PWD 注入）
      store-password: ${SQ_KEYSTORE_PWD:sq-dev-store-pwd}
      # 私钥密码（生产必须通过环境变量 SQ_KEY_PWD 注入）
      key-password: ${SQ_KEY_PWD:sq-dev-key-pwd}
      # 密钥别名
      alias: sq-sm2

# Spring配置
spring:
  application:
    name: sq-admin-server
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: mysql-dev
  # 自动加载本地密钥文件（若不存在则忽略）；勿把 application-local.yml 提交到 Git
  config:
    import: optional:classpath:application-local.yml
  # 文件上传（相册含视频，需明显大于默认 10MB）
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 1024MB
      # 单次请求总大小
      max-request-size: 2048MB
  mvc:
    format:
      date-time: yyyy-MM-dd HH:mm:ss
      date: yyyy-MM-dd
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

# 开发环境配置
server:
  # 服务器的HTTP端口（避开本机动态端口范围 1024+，避免 PortInUse）
  port: 18080
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100
    # 单次请求体上限（与 multipart 对齐，避免被 connector 截断）
    max-http-form-post-size: 2048MB
    max-swallow-size: 2048MB

# 日志配置
logging:
  level:
    com.sq: debug
    org.springframework: warn

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥（生产必须通过环境变量 SQ_JWT_SECRET 注入）
  secret: ${SQ_JWT_SECRET:sq-dev-jwt-secret-please-override-in-prod}
  # 令牌有效期（默认30分钟）
  expireTime: 180


# MyBatis Plus配置
mybatis-plus:
  # 搜索指定包别名
  typeAliasesPackage: com.sq.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:com/sq/**/mapper/xml/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml
  # 逻辑删除统一通过 @TableLogic 注解在实体上声明（字段 del_flag, 0=正常 1=已删除）
  # 不使用全局 db-config.logic-delete-field, 避免与实体字段名/取值不一致造成误导

# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# Springdoc 配置已移除——使用 knife4j-openapi2 (Swagger2 + springfox)

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*

# 相册业务
album:
  uploadPath: D:/uploadPath/album/upload
  thumbPath: D:/uploadPath/album/cache/thumb
  localRoot: D:/uploadPath/album
  thumb:
    smallWidth: 300
    mediumWidth: 800
    largeWidth: 1920
  map:
    type: amap
    # 高德 Key：优先环境变量；本地也可写在 application-local.yml（已 gitignore）
    webKey: ${AMAP_WEB_KEY:}
    jsKey: ${AMAP_JS_KEY:}
    # 火车/高铁优先 OSM 铁路贴轨（Overpass）；失败再回退高德公交/驾车
    osmRailwayEnabled: true
    overpassUrl: ${OSM_OVERPASS_URL:https://overpass-api.de/api/interpreter}
    # Java 访问 Overpass 若报 PKIX 证书错误，保持 true（仅影响 Overpass 连接）
    overpassTrustAllSsl: true
    osmCacheDir: ${OSM_CACHE_DIR:}
    # 火车车次时刻表（聚合数据）；无 Key 时仍可手工填经停站贴轨
    train:
      enabled: true
      provider: juhe
      apiKey: ${JUHE_TRAIN_KEY:}
      queryUrl: https://apis.juhe.cn/fapigw/train/query
      detailUrl: https://apis.juhe.cn/train/s
